[project]
name = "lolstats-backend"
version = "0.1.0"
description = "API própria (FastAPI) que consome a API da Riot e guarda os dados no Postgres"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
